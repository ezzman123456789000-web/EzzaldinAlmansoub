<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض أعمالي | Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background-color: #24292e;
            color: white;
            padding: 1rem 2rem;
            text-align: center;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .card h1 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 1.5rem;
        }

        hr {
            border: 0;
            height: 1px;
            background: #eee;
            margin: 1.5rem 0;
        }

        .card h3 {
            margin-bottom: 1rem;
            color: #34495e;
        }

        ul {
            list-style: none;
            text-align: right;
            display: inline-block;
        }

        ul li {
            padding: 0.5rem 0;
            font-weight: 500;
        }

        footer {
            background-color: #e9ecef;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <h2>مرحباً بك في موقعي 👋</h2>
    </header>

    <main class="container">
        <section class="card">
            <h1> عز الدين المنصوب</h1>
            <p class="subtitle">مطور ويب ممتد الشغف يتدرب حالياً على Git و GitHub</p>
            <hr>
            <h3>🚀 المهارات التي أتعلمها:</h3>
            <ul>
                <li>HTML5 & CSS3</li>
                <li>إدارة الإصدارات باستخدام Git</li>
                <li>مشاركة المشاريع على </li>
            </ul>
        </section>
    </main>

    <footer>
        <p>تم تطوير هذا المشروع للتدريب على Git &copy; 2026</p>
    </footer>
</body>
</html>
